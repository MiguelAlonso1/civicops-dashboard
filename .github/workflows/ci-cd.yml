name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_target:
        description: 'Delete stale files in the target folder (mirror --delete; keeps App_Data, .well-known, logs). Only allowed for PEM/'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Restore
        run: dotnet restore CivicOps.slnx

      - name: Build
        run: dotnet build CivicOps.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CivicOps.slnx -c Release --no-build --nologo --verbosity minimal

      - name: Publish
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        # Self-contained win-x86: host only supports ASP.NET Core up to 10.x (see CLAUDE.md)
        run: dotnet publish CivicOps.Web.csproj -c Release -r win-x86 --self-contained true -o ./publish

      - name: Upload artifact
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./publish

  deploy:
    needs: build
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ./publish

      # Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD; variables: FTP_SERVER_DIR, DEPLOY_ENABLED, SITE_URL (default https://ops.alonsomiguel.com/health) (Settings > Secrets and variables > Actions)
      # The FTP login lands at the ACCOUNT root, which holds one folder per site. Only ever deploy into the site folder.
      - name: Validate target folder
        env:
          RAW_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          DIR="$RAW_DIR"
          DIR="${DIR#./}"; DIR="${DIR#/}"
          while [ "${DIR%/}" != "$DIR" ]; do DIR="${DIR%/}"; done
          case "$DIR" in
            ""|"."|".."|*..*)
              echo "::error::FTP_SERVER_DIR is unset or unsafe ('$RAW_DIR'). Refusing to deploy to the FTP account root. Set it to the site folder, e.g. ops.alonsomiguel.com/"
              exit 1;;
          esac
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.clean_target }}" = "true" ] && [ "$DIR/" != "PEM/" ]; then
            echo "::error::clean_target is only allowed when FTP_SERVER_DIR is exactly PEM/ (got '$DIR/')"
            exit 1
          fi
          echo "SERVER_DIR=$DIR/" >> "$GITHUB_ENV"
          echo "Deploying to folder: $DIR/"

      # Optional AI Assist config. Injected only here (deploy job) and never into the uploaded build artifact, because artifacts of a public repo are downloadable.
      # Each value is added only when set; with no key for the selected provider the app shows the AI buttons disabled. Values are read from the environment and never echoed.
      - name: Configure AI Assist (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$AI_PROVIDER" ]; then
            echo "No AI secrets or variables set: AI Assist stays disabled on the site."
            exit 0
          fi
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path = "publish/web.config"
          tree = ET.parse(path)
          node = tree.getroot().find(".//aspNetCore")
          if node is None:
              raise SystemExit("aspNetCore element not found in web.config")
          env = node.find("environmentVariables")
          if env is None:
              env = ET.SubElement(node, "environmentVariables")
          pairs = [("Ai__Gemini__ApiKey", "GEMINI_API_KEY"), ("Claude__ApiKey", "ANTHROPIC_API_KEY"), ("Ai__Provider", "AI_PROVIDER")]
          added = []
          for name, src in pairs:
              value = os.environ.get(src, "").strip()
              if not value:
                  continue
              for e in list(env):
                  if e.get("name") == name:
                      env.remove(e)
              ET.SubElement(env, "environmentVariable", {"name": name, "value": value})
              added.append(name)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Added to web.config: " + ", ".join(added))
          PY

      # Why lftp and not FTP-Deploy-Action: the host's IIS FTP requires TLS session reuse on data connections;
      # basic-ftp (used by the action) does not do it and fails with ECONNRESET (data socket). lftp/curl handle it.
      # ssl:verify-certificate no: the host certificate is issued for the provider's server name, not for the FTP_SERVER
      # value we connect to, so verification would always fail. The channel is still encrypted (FTPS is forced).
      # Connection method is identical to ftp-inspect.yml (proven): lftp -u "user,pass" "ftp://server" -e "...".
      # Credentials come from the job env (masked by GitHub in logs); cmd:trace stays off.
      - name: Install lftp and write helper
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lftp
          cat > "$HOME/lftp-run.sh" <<'HELPER'
          # usage: lftp_run "<lftp commands joined with &&>"   (run from a step; needs FTP_* env)
          # Fails loudly if the connection/login cannot be established or any command fails.
          lftp_run() {
            local log; log=$(mktemp)
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "set cmd:trace false; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5; cls -1 > /dev/null && echo LFTP_CONNECTED && $1 && echo LFTP_OK; bye" 2>&1 | tee "$log"
            if ! grep -q LFTP_CONNECTED "$log"; then
              echo "::error::lftp could not connect/login to the FTP server (check FTP_SERVER / FTP_USERNAME / FTP_PASSWORD secrets, FTPS settings)"
              return 1
            fi
            if ! grep -q LFTP_OK "$log"; then
              echo "::error::lftp connected but a command failed (see output above)"
              return 1
            fi
          }
          HELPER

      # Write preflight: runs BEFORE the site goes offline. If we cannot create/write/remove inside the site
      # folder, the job fails here and the live site is untouched.
      - name: Preflight write probe
        run: |
          source "$HOME/lftp-run.sh"
          echo probe > probe.txt
          lftp_run "cd \"$SERVER_DIR\" && mkdir -f _deploy_probe && put -O _deploy_probe probe.txt && rm -r _deploy_probe"
          echo "Write probe OK in $SERVER_DIR"

      - name: Put site offline (app_offline.htm)
        id: offline
        run: |
          source "$HOME/lftp-run.sh"
          mkdir -p ./offline
          echo '<html><body><h1>Updating, back in a minute.</h1></body></html>' > ./offline/app_offline.htm
          lftp_run "cd \"$SERVER_DIR\" && put -O . ./offline/app_offline.htm"

      # Optional one-time clean (workflow_dispatch clean_target=true): wait for the app to release its files, then mirror --delete.
      # Never touches App_Data/, .well-known/, logs/, app_offline.htm. Hard-asserted to PEM/ only.
      - name: Clean target folder (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_target }}
        run: |
          [ "$SERVER_DIR" = "PEM/" ] || { echo "::error::Refusing clean: SERVER_DIR is '$SERVER_DIR', must be PEM/"; exit 1; }
          sleep 10
          source "$HOME/lftp-run.sh"
          lftp_run "mirror -R --delete --verbose --parallel=2 --no-perms --exclude-glob .well-known/ --exclude-glob App_Data/ --exclude-glob logs/ --exclude-glob app_offline.htm ./publish/ \"$SERVER_DIR\""

      # Never uses --delete (except the optional clean step above): server files we did not upload (.well-known, *.pfx, App_Data) are never removed.
      # App_Data/ (SQLite database, data-protection keys) and any *.db file are excluded so live data is never overwritten.
      # Default `mirror -R` re-uploads every file whose size differs or whose local mtime is newer than the server's.
      # The artifact is freshly built, so local mtimes are always newer: changed files are always overwritten.
      # (Do NOT add --ignore-time: that compares size only and would skip same-size changed files.)
      - name: Deploy site
        run: |
          source "$HOME/lftp-run.sh"
          lftp_run "mirror -R --verbose --parallel=2 --no-perms --exclude-glob .well-known/ --exclude-glob '*.pfx' --exclude-glob App_Data/ --exclude-glob '*.db' --exclude-glob '*.db-*' --exclude-glob app_offline.htm ./publish/ \"$SERVER_DIR\""

      # Runs even when the deploy failed, so the site always comes back (old or partially updated content).
      - name: Delete app_offline.htm on server
        if: ${{ always() && (steps.offline.outcome == 'success' || steps.offline.outcome == 'failure') }}
        run: |
          source "$HOME/lftp-run.sh"
          ok=""
          for i in 1 2 3 4 5; do
            if lftp_run "cd \"$SERVER_DIR\" && rm -f app_offline.htm"; then ok=1; echo "app_offline.htm deleted"; break; fi
            echo "Delete attempt $i failed"; sleep 10
          done
          if [ -z "$ok" ]; then echo "::error::Could not delete app_offline.htm; site stays offline. Remove it manually (docs/DEPLOYMENT.md)"; exit 1; fi

      - name: Directory listing after deploy
        if: ${{ always() && steps.offline.outcome != 'skipped' }}
        run: |
          source "$HOME/lftp-run.sh"
          echo "Listing of $SERVER_DIR:"
          lftp_run "cls -1 \"$SERVER_DIR\"" || true
          rm -f "$HOME/lftp-run.sh"

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::notice::SITE_URL variable is unset (no hostname bound yet); skipping smoke test."
            exit 0
          fi
          URL="$SITE_URL"
          BASE="${URL%/health}"
          ok=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo 000)
            echo "GET $URL attempt $i: $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 10
          done
          if [ -z "$ok" ]; then echo "::error::Smoke test failed for $URL"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/login" || echo 000)
          echo "GET $BASE/login: $code"; [ "$code" = "200" ] || { echo "::error::/login did not return 200"; exit 1; }
          case "$BASE" in
            https://*)
              host="${BASE#https://}"; host="${host%%/*}"
              read -r code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 20 "http://$host/" || echo "000 ")
              echo "http://$host/ -> $code $loc"
              case "$code:$loc" in
                301:https://*|308:https://*) ;;
                *) echo "::error::http://$host/ does not redirect to https"; exit 1;;
              esac;;
          esac
